# ─────────────────────────────────────────────────────────────────────────────
# MesPapiers — NGINX reverse proxy
#
# Terminates TLS on ports 443 (HTTPS) and redirects port 80 (HTTP) → 443.
# Proxies all traffic to the Next.js container ("web" service on port 3000).
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;

    keepalive_timeout  65;
    client_max_body_size 20M;

    # ── WebSocket upgrade map ───────────────────────────────────────────────
    # Only send "Connection: upgrade" when the client actually requests it.
    # Normal HTTP requests get "Connection: close" instead.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Upstream — the Next.js container ────────────────────────────────────

    upstream nextjs {
        server web:3000;
    }

    # ── HTTP → HTTPS redirect ───────────────────────────────────────────────

    server {
        listen 80;
        server_name mespapiers.local localhost;

        return 301 https://$host$request_uri;
    }

    # ── HTTPS server ────────────────────────────────────────────────────────

    server {
        listen 443 ssl;
        server_name mespapiers.local localhost;

        # Certs are resolved by entrypoint.sh (mkcert or self-signed)
        ssl_certificate     /etc/nginx/certs/selfsigned.pem;
        ssl_certificate_key /etc/nginx/certs/selfsigned-key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # ── Next.js application ─────────────────────────────────────────────

        location / {
            proxy_pass http://nextjs;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket: conditional upgrade (HMR + future WS engine)
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Keep WebSocket connections alive (default 60s kills HMR)
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
