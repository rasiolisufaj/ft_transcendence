services:
  db:
    image: postgres:17-alpine
    container_name: mespapiers_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env — see .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # TODO(PROJECT_PLAN §3): move this to docker-compose.override.yml once the
      # app is containerised. The base compose file must not publish data
      # services to the host — only nginx is reachable from a browser.
      - "5432:5432"
    volumes:
      # Named volume, not a bind mount: ./postgres-data was leaking into git
      # (see commit 151a2eb). Reset the database with:
      #   docker compose down -v
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Lets future services declare `depends_on: {db: {condition: service_healthy}}`
      # instead of racing Postgres at startup.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
