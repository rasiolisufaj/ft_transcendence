services:
  # ── NGINX reverse proxy (TLS termination) ──────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: mespapiers_nginx
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/entrypoint.sh:/entrypoint.sh:ro
      - nginx-certs:/etc/nginx/certs
    entrypoint: ["/entrypoint.sh"]
    depends_on:
      - web
      - realtime

  # ── Next.js application ────────────────────────────────────────────────────
  web:
    build: .
    container_name: mespapiers_web
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
      # Document classification on upload. Absent = documents stay PENDING
      # instead of the upload failing, so the app runs without a key.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # Signs WebSocket tickets (POST /api/auth/ws-ticket). Absent = that route
      # answers 500; the rest of the app runs.
      WS_TICKET_SECRET: "${WS_TICKET_SECRET:-}"
      # Realtime: web posts events to the realtime service over internal HTTP.
      REALTIME_INTERNAL_URL: "http://realtime:3001"
      REALTIME_PUBLISH_SECRET: "${REALTIME_PUBLISH_SECRET:-}"
      # OAuth (phase 8). APP_URL must be the origin the browser is on; empty Google
      # keys make the Google button go back to the login page.
      APP_URL: "${APP_URL:-https://mespapiers.local}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      # Mailpit catches every email in dev (web UI on http://localhost:8025).
      SMTP_HOST: "mailpit"
      # Mailpit's port inside the network; .env's SMTP_PORT is for `npm run dev` on the host.
      SMTP_PORT: "1025"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./prisma:/app/prisma
      # Le Dockerfile fait `COPY . .`, donc tout fichier de config a la racine est
      # figé dans l'image : l'éditer n'a aucun effet sans rebuild. On monte celui-ci
      # parce que `next dev` redémarre tout seul quand il change.
      - ./next.config.ts:/app/next.config.ts
      - ./messages:/app/messages

  # ── Realtime WebSocket server ───────────────────────────────────────────────
  realtime:
    build: .
    container_name: mespapiers_realtime
    restart: unless-stopped
    command: ["sh", "-c", "npx prisma generate && npx tsx src/realtime/main.ts"]
    expose:
      - "3001"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
      WS_TICKET_SECRET: "${WS_TICKET_SECRET:-}"
      REALTIME_PUBLISH_SECRET: "${REALTIME_PUBLISH_SECRET:-}"
      REALTIME_PORT: "3001"
      HEARTBEAT_MS: "30000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - /app/src/generated

  # ── PostgreSQL database ────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    container_name: mespapiers_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env — see .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.6
    container_name: mespapiers_mailpit
    restart: unless-stopped
    # This machine only: the UI shows every caught email, and 1025 accepts mail from anyone who reaches it.
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  postgres-data:
  nginx-certs:
